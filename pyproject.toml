[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penmunshi"
version = "0.1.0"
description = "Offline-first pentest/VAPT report copilot: a local Gemma model drafts, deterministic code verifies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Farhan Shaikh" }]
keywords = ["pentest", "vapt", "security-report", "gemma", "ollama", "local-first"]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "cvss>=3.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ocr = ["rapidocr-onnxruntime"]   # optional: pixel-level screenshot redaction (see .agent/skills/screenshot-redaction)

[project.scripts]
penmunshi = "penmunshi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penmunshi = ["data/*.json", "eval/cases/*.json", "eval/cases/assets/*", "report/templates/*.j2", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
